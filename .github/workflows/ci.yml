name: ci

on:
  pull_request:
    branches: [master, production]
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      docker:
        description: Build the Docker image as a check
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: lint · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: |
          npx next typegen
          npx tsc --noEmit

  # next build runs inside the Dockerfile, so this job is the build check
  docker:
    name: docker build
    if: inputs.docker != false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.example.com/api' }}
          cache-from: type=gha,scope=front
          cache-to: type=gha,scope=front,mode=max
